<!--
  The full-API half of the eda-agent bridge.

  EasyEDA gives an extension's MAIN process a reduced `eda`: measured
  live, six classes, none of the document API. The officially practiced
  route to the rest is an inline frame: EasyEDA's own silkscreen
  extension does all of its PCB work from iframe JS, whose `eda`
  carries the pcb_*/sch_*/lib_* classes.

  So this page embeds the SAME bridge entry the main process runs
  (BRIDGE_SOURCE below is injected by build.py from the stripped
  main.js) and calls connect() itself. The server then has a connection
  whose runtime can actually answer document commands. The iframe also
  has real browser globals, so fetch-based discovery works here.

  Opened by activate() at startup, collapsed. Closing it only closes
  the full-API connection; the main process connection stays.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>eda-agent bridge</title>
  <style>
    body { font-family: sans-serif; font-size: 12px; margin: 8px; }
    #state { color: #666; }
  </style>
</head>
<body>
  <div>eda-agent bridge (full-API connection)</div>
  <div id="state">starting...</div>
  <script>
/* __BRIDGE_SOURCE__ */
  </script>
  <script>
    (function () {
      var state = document.getElementById('state');
      function show(text) { state.textContent = text; }
      try {
        if (typeof eda === 'undefined' || !eda.sys_WebSocket) {
          show('no eda API in this frame; nothing to bridge');
          return;
        }
        if (typeof connect !== 'function') {
          show('bridge source failed to load');
          return;
        }
        show('connecting...');
        connect();
        setInterval(function () {
          show(typeof connected !== 'undefined' && connected
            ? 'connected' : 'searching for the eda-agent server...');
        }, 1000);
      } catch (error) {
        show('failed: ' + error);
      }
    })();
  </script>
</body>
</html>
