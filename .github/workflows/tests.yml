name: Suite tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline stdio startup without an Altium installation
        run: python tests/smoke_stdio.py
      - name: Complete root regression suite, native codecs and package license closure
        run: python -m pytest tests -q
      - name: Native gateway catalog and all library contracts without external executables
        run: python tests/smoke_suite_stdio.py --toolset full
      - name: Complete EDA regression suite
        run: python -m pytest tests -q
        working-directory: eda-agent
      - name: Build and verify actual EDA wheel native project closure
        run: |
          python -m pip wheel --no-deps ./eda-agent --wheel-dir dist/wheels
          python scripts/build_plugin.py --check-wheel dist/wheels
      - name: Clean plugin package, reproducibility and isolated MCP startup
        run: python scripts/build_plugin.py --output dist --smoke --check-reproducible
